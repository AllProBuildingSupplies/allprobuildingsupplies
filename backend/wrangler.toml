name = "allpro-api"
main = "src/index.js"
compatibility_date = "2024-04-21"

# Secrets (wrangler secret put NAME): ADMIN_TOKEN, JWT_SECRET,
# EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, EMAILJS_PUBLIC_KEY,
# EMAILJS_PRIVATE_KEY (optional), NOTIFY_EMAIL
# CATALOG_SYNC_TOKEN (optional) — Bearer token for automated product replace/sync
# BANQUEST_API_KEY, BANQUEST_API_PIN — Banquest/Accept.Blue API (Plan B / API)
# BANQUEST_WEBHOOK_SECRET — HMAC secret from Banquest when you create the webhook
#
# Admin Microsoft SSO (live + test; password login remains as backup):
#   MICROSOFT_CLIENT_ID, MICROSOFT_TENANT_ID, ADMIN_SSO_EMAIL
#   Entra SPA redirect URIs must include:
#     https://allprobuildingsupplies.com/admin.html
#     https://www.allprobuildingsupplies.com/admin.html  (if used)
#     https://allpro-test.pages.dev/admin.html
#   Invoice PDF attachments (recommended — bypasses EmailJS attachment limits):
#     Add Microsoft Graph delegated permission Mail.Send + admin consent.
#     Admin signs in with Microsoft → Worker sends via Graph with real PDF attach.
#     Optional app-only send-as mailbox (works with password login too):
#       MICROSOFT_CLIENT_SECRET, MAIL_FROM=orders@allprobuildingsupplies.com
#       + Application permission Mail.Send + admin consent
#
# Invoice payment methods (optional; sensible defaults exist in code):
#   BANQUEST_PAY_PAGE_URL — hosted Banquest pay page (Plan A)
#   PAYMENT_CC_LINK or PAYMENT_STRIPE_LINK — optional fallback hosted card URL
#   PAYMENT_CC_FEE_PERCENT — card convenience fee % shown on invoices (default 3)
#   BUSINESS_MAILING_ADDRESS — remittance / mail-to address shown on invoices
#   PAYMENT_ZELLE_EMAIL, PAYMENT_ZELLE_HANDLE, PAYMENT_ZELLE_QR_URL
#   PAYMENT_WIRE_INSTRUCTIONS, PAYMENT_ACH_INSTRUCTIONS (multi-line text OK as secret)
#   Banquest webhooks (paste into Banquest Control Panel → Webhooks):
#     Live:  https://allpro-api.baruch-6d5.workers.dev/api/webhooks/banquest
#     Test:  https://allpro-api-test.baruch-6d5.workers.dev/api/webhooks/banquest
#   STRIPE_WEBHOOK_SECRET — optional legacy Stripe auto mark-paid
#
# Test/staging Worker (does NOT touch production):
#   npx wrangler deploy --env test
#   npx wrangler secret put ADMIN_TOKEN --env test
#   npx wrangler secret put JWT_SECRET --env test
#   npx wrangler secret put BANQUEST_API_KEY --env test
#   npx wrangler secret put BANQUEST_API_PIN --env test
#   npx wrangler secret put BANQUEST_WEBHOOK_SECRET --env test

# Non-secret invoice payment copy for production (same defaults as code / test).
[vars]
PAYMENT_ZELLE_EMAIL = "payments@allprobuildingsupplies.com"
PAYMENT_ZELLE_HANDLE = "allprobuildingsupplies"
PAYMENT_CC_FEE_PERCENT = "3"
BANQUEST_PAY_PAGE_URL = "https://pay.banquest.com/allprobuilding"
# Remittance address for mailed payments (shown on invoices under info@…).
BUSINESS_MAILING_ADDRESS = "35 Hope Hill Lane\nLakewood NJ 08701"
PAYMENT_WIRE_INSTRUCTIONS = "Wire transfer to All Pro Building Supplies. Email payments@allprobuildingsupplies.com or call 732-734-1123 for routing & account numbers. Include your Order ID in the wire memo."
PAYMENT_ACH_INSTRUCTIONS = "ACH / bank transfer to All Pro Building Supplies. Email payments@allprobuildingsupplies.com for ACH details. Include your Order ID in the payment memo."

# Bindings to your D1 Databases (PRODUCTION).
# Do NOT set preview_database_id here — wrangler may display/bind the preview ID
# during deploy dry-runs. Staging uses env.test with its own database_id below.
[[d1_databases]]
binding = "DB"
database_name = "allpro-db"
database_id = "31689783-6a85-460f-b9ac-7ba9d7be8dc0"

# ── TEST / STAGING ────────────────────────────────────────────
# Separate Worker name + separate D1 (preview DB). Live site untouched.
[env.test]
name = "allpro-api-test"

# Non-secret invoice payment copy for staging.
[env.test.vars]
PAYMENT_ZELLE_EMAIL = "payments@allprobuildingsupplies.com"
PAYMENT_ZELLE_HANDLE = "allprobuildingsupplies"
PAYMENT_CC_FEE_PERCENT = "3"
BANQUEST_PAY_PAGE_URL = "https://pay.banquest.com/allprobuilding"
BUSINESS_MAILING_ADDRESS = "35 Hope Hill Lane\nLakewood NJ 08701"
PAYMENT_WIRE_INSTRUCTIONS = "Wire transfer to All Pro Building Supplies. Email payments@allprobuildingsupplies.com or call 732-734-1123 for routing & account numbers. Include your Order ID in the wire memo."
PAYMENT_ACH_INSTRUCTIONS = "ACH / bank transfer to All Pro Building Supplies. Email payments@allprobuildingsupplies.com for ACH details. Include your Order ID in the payment memo."

[[env.test.d1_databases]]
binding = "DB"
database_name = "allpro-db"
database_id = "cb7c6d87-4ca6-4897-a953-4d81650034b8"
