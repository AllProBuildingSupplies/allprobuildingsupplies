<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>All Pro OS Phone — TEST</title>
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/style.css"/>
<link rel="stylesheet" href="assets/ops-m/style.css?v=m3"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0C1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="OS Phone"/>
<link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
</head>
<body class="m-body">
<div id="ops-login" class="m-login" hidden>
  <div class="m-login-card">
    <div class="m-login-theme">
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode" title="Light mode">
        <svg class="theme-toggle-ico theme-ico-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.3A9 9 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg>
        <svg class="theme-toggle-ico theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <img src="images/logo.png" alt="All Pro" width="96"/>
    <p class="m-kicker">TEST · Phone</p>
    <h1>All Pro OS</h1>
    <p class="m-lead">Same admin password as the test Worker. Built for the floor, dock, and truck — desktop OS is unchanged.</p>
    <input type="password" id="ops-pin" class="data-input" placeholder="Admin password" autocomplete="current-password"/>
    <button type="button" class="m-btn m-btn-gold" id="ops-login-btn">Enter phone OS</button>
    <p id="ops-login-err" class="m-error" hidden></p>
    <a id="m-desk-from-login" href="ops.html">Desktop OS →</a>
  </div>
</div>

<div id="ops-app" class="m-app" hidden>
  <header class="m-top">
    <div>
      <p class="m-kicker" id="m-kicker">Today</p>
      <h1 class="m-title" id="m-title">Today</h1>
    </div>
    <div class="m-top-actions">
      <button type="button" class="m-icon-btn" id="m-search-btn" aria-label="Search">⌕</button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to light mode" title="Light mode">
        <svg class="theme-toggle-ico theme-ico-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.3A9 9 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg>
        <svg class="theme-toggle-ico theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div id="ops-flash" class="m-flash" hidden></div>
  <div id="m-search-bar" class="m-search-bar" hidden>
    <input type="search" id="ops-search" class="data-input" placeholder="Orders, SKUs, customers…" autocomplete="off"/>
  </div>
  <main id="ops-view" class="m-view">Loading…</main>
  <div class="m-tabbar" aria-label="Phone modules">
    <a href="#/today" data-tab="today"><span>Today</span></a>
    <a href="#/orders" data-tab="orders"><span>Orders</span></a>
    <a href="#/floor" data-tab="floor"><span>Floor</span></a>
    <a href="#/run" data-tab="run"><span>Run</span></a>
    <a href="#/more" data-tab="more"><span>More</span></a>
  </div>
</div>

<div id="m-sheet" class="m-sheet" hidden>
  <div class="m-sheet-card" id="m-sheet-card"></div>
</div>

<script src="assets/main.js"></script>
<script src="assets/ops-m/app.js?v=m3" type="module"></script>
</body>
</html>
