<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<meta name="theme-color" content="#0C1117"/>

<style>
  .offline-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,152,31,.12), transparent 55%), var(--ink);
  }
  .offline-wrap img { width: 120px; margin-bottom: 24px; }
  .offline-wrap h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    color: var(--white);
    margin: 0 0 12px;
  }
  .offline-wrap p {
    color: var(--silver);
    max-width: 360px;
    line-height: 1.55;
    margin: 0 0 24px;
  }
</style>

<body>
  <div class="offline-wrap">
    <img src="images/logo.png" alt="All Pro Building Supplies"/>
    <h1>You're offline</h1>
    <p>All Pro needs a connection for catalog, cart, and admin. Check your signal, then try again.</p>
    <a class="btn-gold" href="index.html">Retry</a>
